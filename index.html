<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Autoclik Bug Hunter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EF; --surface:rgba(255,255,255,.82); --surface-2:rgba(33,28,20,.04); --ink:#211C16; --ink-soft:#726B5E;
    --line:rgba(33,28,20,.10); --accent:#F49800; --accent-ink:#211C16; --accent-soft:rgba(244,152,0,.16);
    --good:#1F845A; --good-soft:rgba(31,132,90,.13); --warn:#B76E00; --warn-soft:rgba(183,110,0,.14);
    --muted:#6B6B70; --muted-soft:rgba(107,107,112,.10); --insight:#5E5ADB; --insight-soft:rgba(94,90,219,.12);
    --info:#0B66C3; --info-soft:rgba(11,102,195,.12); --fixed:#0E8074; --fixed-soft:rgba(14,128,116,.12);
    --danger:#C9372C; --danger-soft:rgba(201,55,44,.12);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18191B; --surface:#232426; --surface-2:#2B2C2F; --ink:#F0F0F1; --ink-soft:#A6A6AC;
      --line:#38393D; --accent:#FFA824; --accent-ink:#1A1A1A; --accent-soft:#3A2E10;
      --good:#3FBE85; --good-soft:#123526; --warn:#E0A83C; --warn-soft:#3A2E10;
      --muted:#96969C; --muted-soft:#303134; --insight:#9997F0; --insight-soft:#26264A;
      --info:#6FB2F0; --info-soft:#132E4A; --fixed:#4FC9BC; --fixed-soft:#0F332E;
      --danger:#FF6B5B; --danger-soft:#3A1B17;
    }
  }
  :root[data-theme="dark"]{
    --bg:#18191B; --surface:#232426; --surface-2:#2B2C2F; --ink:#F0F0F1; --ink-soft:#A6A6AC;
    --line:#38393D; --accent:#FFA824; --accent-ink:#1A1A1A; --accent-soft:#3A2E10;
    --good:#3FBE85; --good-soft:#123526; --warn:#E0A83C; --warn-soft:#3A2E10;
    --muted:#96969C; --muted-soft:#303134; --insight:#9997F0; --insight-soft:#26264A;
    --info:#6FB2F0; --info-soft:#132E4A; --fixed:#4FC9BC; --fixed-soft:#0F332E;
    --danger:#FF6B5B; --danger-soft:#3A1B17;
  }
  :root{
    --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-xl:24px; --radius-pill:999px;
    --shadow-sm:0 1px 3px rgba(33,28,20,.06);
    --shadow-md:0 10px 28px rgba(33,28,20,.09);
    --shadow-lg:0 28px 56px rgba(33,28,20,.14);
    --accent-glow:rgba(244,152,0,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 6px 20px rgba(0,0,0,.5); --shadow-lg:0 24px 52px rgba(0,0,0,.6); --accent-glow:rgba(255,168,36,.28);
    }
  }
  :root[data-theme="dark"]{
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 6px 20px rgba(0,0,0,.5); --shadow-lg:0 24px 52px rgba(0,0,0,.6); --accent-glow:rgba(255,168,36,.28);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  button{appearance:none; -webkit-appearance:none; font:inherit; color:inherit;}
  html{margin:0;background:var(--bg);color:var(--ink); overflow-x:hidden;}
  body{
    margin:0; color:var(--ink);
    font-family:"Kanit",system-ui,-apple-system,sans-serif; font-size:14.5px; line-height:1.55; padding:14px 14px 56px; -webkit-font-smoothing:antialiased;
    background-color:var(--bg); overflow-x:hidden; max-width:100vw;
  }
  img{max-width:100%;}
  h1,h2,h3{font-family:"Kanit",system-ui,sans-serif; font-weight:600; letter-spacing:-.01em; text-wrap:balance; margin:0; color:var(--ink);}
  .mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}
  .wrap{max-width:1180px; margin:0 auto;}
  a{color:var(--accent);}

  /* utility bar: theme + language */
  .util-bar{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .util-group{display:flex; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:3px; box-shadow:none;}
  .util-group button{border:0; background:transparent; color:var(--ink-soft); font-size:12px; font-weight:600; padding:6px 11px; border-radius:8px; cursor:pointer; font-family:"IBM Plex Mono",monospace; transition:background .15s ease, color .15s ease;}
  .util-group button:hover{color:var(--ink); background:var(--surface-2);}
  .util-group button[aria-pressed="true"]{background:var(--accent); color:#fff; box-shadow:none;}

  .emp-profile-bar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:14px; box-shadow:none;}
  .emp-profile-bar span{font-size:13px; color:var(--ink-soft); font-weight:500;}
  .emp-profile-bar span b{color:var(--ink); font-weight:700;}

  .hero{
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px 22px; position:relative; margin-bottom:14px;
    box-shadow:none; border-left:3px solid var(--accent);
  }
  .hero .eyebrow{display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; background:var(--accent-soft); color:#8a5600; padding:5px 11px; border-radius:var(--radius-sm); margin-bottom:12px;}
  :root[data-theme="dark"] .hero .eyebrow, :root:not([data-theme="light"]) .hero .eyebrow{ color:#ffd699; }
  .hero h1{font-size:clamp(19px,4vw,24px); font-weight:700; letter-spacing:0; text-transform:none;}
  .hero p{margin:8px 0 0; max-width:56ch; color:var(--ink-soft); font-size:13.5px; font-weight:500;}
  .hero-meta{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; font-size:11.5px;}
  .hero-meta > div{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 14px;}
  .hero-meta b{font-family:"IBM Plex Mono",monospace; font-size:15px; font-weight:600; display:block; margin-top:2px; color:var(--ink);}

  /* Top nav bar + centered "wordmark" hero, AuthKit-composition-inspired */
  .top-nav{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 4px 14px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand-logo{height:26px; width:auto; display:block; flex:none;}
  .brand-name{font-weight:700; font-size:14px; letter-spacing:.06em; color:var(--ink); font-family:"IBM Plex Mono",monospace;}
  .top-nav-right{display:flex; gap:8px; flex-wrap:wrap;}

  .hero-centered{text-align:center; padding:44px 24px 40px;}
  .hero-centered .eyebrow{margin-left:auto; margin-right:auto;}
  .hero-title-gradient{
    font-size:clamp(30px,6vw,46px); font-weight:800; letter-spacing:-.02em;
    background:linear-gradient(180deg, var(--ink) 10%, var(--accent) 160%);
    -webkit-background-clip:text; background-clip:text; color:var(--ink); -webkit-text-fill-color:transparent;
  }
  .hero-centered p{margin:10px auto 0; max-width:52ch;}
  .hero-fan{position:relative; display:flex; justify-content:center;}
  .hero-fan .hero-meta{justify-content:center; margin-top:26px;}
  .hero-fan .hero-meta > div:nth-child(1){transform:rotate(-2.5deg);}
  .hero-fan .hero-meta > div:nth-child(2){transform:rotate(2deg);}
  .hero-fan .hero-meta > div{transition:transform .2s ease;}
  .hero-fan .hero-meta > div:hover{transform:rotate(0deg) translateY(-2px);}
  @media (max-width:640px){ .hero-fan .hero-meta > div:nth-child(1), .hero-fan .hero-meta > div:nth-child(2){transform:none;} }

  .role-nav{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-md); padding:4px; margin-bottom:14px; box-shadow:none;}
  .role-nav button{flex:1; border:0; background:transparent; color:var(--ink-soft); font-family:"Kanit",sans-serif; text-transform:none; letter-spacing:0; font-size:13px; font-weight:600; padding:9px 6px; border-radius:8px; cursor:pointer; transition:background .15s ease, color .15s ease, box-shadow .15s ease;}
  .role-nav button:hover{color:var(--ink);}
  .role-nav button[aria-selected="true"]{background:var(--surface); color:var(--accent); box-shadow:var(--shadow-sm); border:1px solid var(--line);}

  .tabs{display:flex; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:4px; margin-bottom:16px; overflow-x:auto; box-shadow:none; -webkit-overflow-scrolling:touch; scrollbar-width:none; transition:mask-image .15s ease, -webkit-mask-image .15s ease;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs.has-more-end{ -webkit-mask-image:linear-gradient(to right, black 0, black calc(100% - 28px), transparent 100%); mask-image:linear-gradient(to right, black 0, black calc(100% - 28px), transparent 100%); }
  .tabs.has-more-start{ -webkit-mask-image:linear-gradient(to left, black 0, black calc(100% - 28px), transparent 100%); mask-image:linear-gradient(to left, black 0, black calc(100% - 28px), transparent 100%); }
  .tabs.has-more-start.has-more-end{ -webkit-mask-image:linear-gradient(to right, transparent 0, black 28px, black calc(100% - 28px), transparent 100%); mask-image:linear-gradient(to right, transparent 0, black 28px, black calc(100% - 28px), transparent 100%); }
  .tab:hover{color:var(--ink); background:var(--surface-2);}
  .tab[aria-selected="true"]{background:var(--accent-soft); color:#8a5600; box-shadow:none;}
  .tab{flex:1 1 auto; white-space:nowrap; border:0; background:transparent; color:var(--ink-soft); font-family:"Kanit",sans-serif; text-transform:none; letter-spacing:0; font-size:13px; padding:9px 12px; border-radius:8px; cursor:pointer; font-weight:600; transition:background .15s ease, color .15s ease, box-shadow .15s ease;}

  /* Desktop: left sidebar navigation for the Employee and Marketing app shells */
  @media (min-width:881px){
    #emp-app{display:grid; grid-template-columns:224px 1fr; gap:20px; align-items:start;}
    #emp-app > .tabs{grid-column:1; grid-row:1; flex-direction:column; align-items:stretch; gap:2px; padding:8px; position:sticky; top:14px; margin-bottom:0;}
    #emp-app > .tabs .tab{text-align:left; padding:10px 12px; border-left:3px solid transparent;}
    #emp-app > .tabs .tab[aria-selected="true"]{border-left-color:var(--accent);}
    #emp-app > .emp-profile-bar{grid-column:1; grid-row:2; flex-direction:column; align-items:stretch; gap:6px; position:sticky; top:230px; margin-bottom:0;}
    #emp-app > section{grid-column:2; grid-row:1/3;}
    #mkt-app{display:grid; grid-template-columns:224px 1fr; gap:20px; align-items:start;}
    #mkt-app > .tabs{grid-column:1; flex-direction:column; align-items:stretch; gap:2px; padding:8px; position:sticky; top:14px; margin-bottom:0;}
    #mkt-app > .tabs .tab{text-align:left; padding:10px 12px; border-left:3px solid transparent;}
    #mkt-app > .tabs .tab[aria-selected="true"]{border-left-color:var(--accent);}
    #mkt-app > section{grid-column:2;}
    #emp-app > .tabs, #mkt-app > .tabs{ border-radius:var(--radius-lg) !important; }
    #emp-app > .tabs .tab, #mkt-app > .tabs .tab{ border-radius:var(--radius-sm) !important; }
  }

  /* Mobile & tablet: comfortable touch targets and single-column layout (phone-first for report submission) */
  @media (max-width:880px){
    body{padding:10px 10px 48px; font-size:15px;}
    .wrap{max-width:100%;}
    .card{padding:16px; border-radius:var(--radius-md);}
    .btn{padding:13px 20px; font-size:14px; min-height:46px;}
    .btn.small{padding:10px 14px; min-height:38px;}
    .tab{padding:12px 14px; font-size:13px; min-height:44px; display:flex; align-items:center; justify-content:center; scroll-snap-align:start;}
    .tabs{scroll-snap-type:x proximity;}
    .role-nav button{padding:12px 6px; min-height:44px;}
    .seg button{padding:11px 14px; min-height:42px;}
    .big-btn{padding:16px; min-height:48px;}
    .util-group button{padding:9px 12px; min-height:38px;}
    input[type=text],input[type=url],input[type=date],input[type=tel],textarea,select{padding:12px 13px;}
    .photo-thumb{width:84px; height:84px;}
    .photo-thumb button{width:26px; height:26px; top:-8px; right:-8px; font-size:14px;}
    .form-step{padding:14px;}
    .filters{flex-direction:column; align-items:stretch;}
    .filters select{width:100%; padding:11px 12px;}
    .bar-row .lbl{width:88px; font-size:11px;}
    .stat-grid{grid-template-columns:repeat(2,1fr); gap:8px;}
    .admin-controls{grid-template-columns:1fr;}
    .admin-controls .af-actions{justify-content:stretch;}
    .admin-controls .af-actions .btn{flex:1;}
    .hero{padding:16px 16px;}
    .hero-meta{gap:8px;}
    .hero-meta > div{padding:7px 12px;}
  }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; margin-bottom:16px;
    box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.6);
  }
  :root[data-theme="dark"] .card, :root:not([data-theme="light"]) .card{ box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.04); }
  .card h2{font-size:16px; margin-bottom:4px; letter-spacing:0; font-weight:700;}
  .subtext{color:var(--ink-soft); font-size:13px; margin:0 0 16px;}

  .report-progress-wrap{margin-bottom:18px;}
  .report-progress-track{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-pill); height:6px; overflow:hidden;}
  .report-progress-fill{background:var(--accent); height:100%; border-radius:var(--radius-pill); transition:width .3s ease;}
  .report-progress-label{font-size:11.5px; color:var(--ink-soft); margin-top:6px; font-weight:600;}
  .form-step{border:1px solid var(--line); border-radius:var(--radius-md); padding:16px; margin-bottom:14px; background:var(--surface-2); transition:border-color .15s ease;}
  .form-step.is-done{border-color:var(--good);}
  .form-step-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .form-step-num{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:12.5px; color:var(--accent); background:var(--accent-soft); width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;}
  .form-step.is-done .form-step-num{color:#fff; background:var(--good);}
  .form-step-title{font-weight:700; font-size:14px; color:var(--ink);}
  .form-step .field:last-child{margin-bottom:0;}

  label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin:0 0 7px;}
  .field{margin-bottom:15px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:640px){.row2,.row3{grid-template-columns:1fr;}}
  input[type=text],input[type=url],input[type=date],input[type=tel],textarea,select{
    width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:hover,textarea:hover,select:hover{border-color:var(--ink-soft);}
  textarea{resize:vertical; min-height:76px;}
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg button{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); padding:9px 15px; border-radius:var(--radius-md); font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; transition:all .15s ease;}
  .seg button:hover{border-color:var(--accent);}
  .seg button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:#8a5600; box-shadow:none;}
  .btn{
    border:1px solid transparent; background:var(--accent); color:#fff;
    font-family:"Kanit",sans-serif; text-transform:none; letter-spacing:0; font-weight:600; font-size:13.5px;
    padding:10px 20px; border-radius:var(--radius-md); cursor:pointer;
    box-shadow:0 6px 16px rgba(244,152,0,.24);
    transition:background .12s ease, box-shadow .18s ease, opacity .12s ease, transform .12s ease;
  }
  .btn:hover{background:#DC8700; box-shadow:0 10px 26px rgba(244,152,0,.34); transform:translateY(-1px);}
  .btn:active{background:#C67900; transform:translateY(0);}
  .btn:disabled{opacity:.5; cursor:default; transform:none; box-shadow:none;}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--surface-2); border-color:var(--ink-soft);}
  .btn.small{padding:7px 13px; font-size:12px;}
  .btn.block{width:100%;}
  .status-msg{font-size:13px; margin-top:10px; font-weight:500;}
  .status-msg.ok{color:var(--good);}
  .status-msg.err{color:var(--danger);}

  .photo-drop{border:1.5px dashed var(--line); border-radius:var(--radius-md); padding:16px; text-align:center; background:var(--surface-2); transition:border-color .15s ease, background .15s ease;}
  .photo-drop.drag{border-color:var(--accent); background:var(--accent-soft);}
  .photo-drop-empty{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .photo-drop-empty span{font-size:13px; color:var(--ink-soft);}
  .photo-preview-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; justify-content:center;}
  .photo-thumb{position:relative; width:76px; height:76px;}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; border-radius:var(--radius-sm); box-shadow:var(--shadow-sm); display:block;}
  .photo-thumb button{position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .report-photo{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;}
  .report-photo img{max-width:120px; max-height:120px; border-radius:var(--radius-sm); display:block; box-shadow:var(--shadow-sm); cursor:pointer; object-fit:cover;}

  .stat-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  @media (max-width:680px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 10px; text-align:center; transition:box-shadow .15s ease, border-color .15s ease;}
  .stat-tile:hover{box-shadow:var(--shadow-sm); border-color:var(--ink-soft);}
  .stat-tile .icon{width:32px; height:32px; border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center; font-size:14px; margin:0 auto 9px; background:var(--surface-2); box-shadow:none;}
  .stat-tile .num{font-family:"IBM Plex Mono",monospace; font-size:21px; font-weight:700; color:var(--ink); line-height:1;}
  .stat-tile .lbl{font-size:11px; color:var(--ink-soft); margin-top:5px; font-weight:500;}
  .stat-tile.tone-good .icon{background:var(--good-soft); color:var(--good);}
  .stat-tile.tone-warn .icon{background:var(--warn-soft); color:var(--warn);}
  .stat-tile.tone-info .icon{background:var(--info-soft); color:var(--info);}
  .stat-tile.tone-muted .icon{background:var(--muted-soft); color:var(--muted);}
  .stat-tile.tone-insight .icon{background:var(--insight-soft); color:var(--insight);}
  .stat-tile.tone-fixed .icon{background:var(--fixed-soft); color:var(--fixed);}

  .progress-track{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-pill); height:10px; overflow:hidden; position:relative;}
  .progress-fill{background:var(--accent); height:100%; border-radius:var(--radius-pill); transition:width .4s ease;}

  .btn-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media (max-width:520px){.btn-grid{grid-template-columns:1fr;}}
  .big-btn{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:15px; cursor:pointer; font:inherit; text-align:left; color:var(--ink); transition:box-shadow .15s ease, border-color .15s ease;}
  .big-btn:hover{box-shadow:var(--shadow-sm); border-color:var(--accent); transform:none;}
  .big-btn.primary{background:var(--accent); border-color:transparent; color:#fff; grid-column:1/-1; box-shadow:none;}
  .big-btn.primary:hover{border-color:transparent; background:#DC8700;}
  .big-btn .ic{font-size:22px; flex:none; width:42px; height:42px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border-radius:var(--radius-pill);}
  .big-btn.primary .ic{background:rgba(255,255,255,.2);}

  .announce{background:var(--accent-soft); color:#8a5600; border-radius:var(--radius-sm); padding:11px 15px; font-size:13px; font-weight:600; margin-bottom:16px; border:1px solid var(--accent-soft); display:flex; align-items:center; gap:8px;}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}

  .admin-controls{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px; margin-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  /* Auth-card composition (login / passcode screens) — centered floating card, AuthKit-style */

  .auth-shell.auth-wide .card > .auth-icon, .auth-shell.auth-wide .card > .auth-eyebrow, .auth-shell.auth-wide .card > h2, .auth-shell.auth-wide .card > .subtext{text-align:center;}

  :root[data-theme="dark"] .auth-shell .card::before{
    content:""; position:absolute; inset:-40px -40px auto -40px; height:220px; z-index:-1; pointer-events:none;
    background:radial-gradient(closest-side, rgba(244,152,0,.16), transparent 70%);

  /* Mascot onboarding (Buggy) — tap-through intro shown before employee login */
  .onboard-card{max-width:400px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; text-align:center; display:flex; flex-direction:column;}
  .auth-shell.auth-wide .onboard-card{text-align:center;}
  .onboard-card.is-final{cursor:default;}
  .onboard-card > .auth-eyebrow{order:0;}
  .onboard-card > .onboard-stage{order:1;}
  .onboard-card > .onboard-tap{order:2;}
  .onboard-card > .onboard-caption{order:3;}
  .onboard-card > .onboard-hint{order:4;}
  .onboard-card > #onboard-start-btn{order:5;}
  .onboard-card > .onboard-dots{order:6;}
  .onboard-card[data-step="3"] > .onboard-caption{order:0; margin-top:2px;}
  .onboard-stage{position:relative; display:flex; align-items:flex-end; justify-content:center; height:200px; margin:4px auto 10px;}
  .onboard-mascot{height:100%; width:auto; display:none;}
  .onboard-mascot-sleep{position:relative;}
  .onboard-mascot-spotted{position:relative;}
  .onboard-mascot-checklist{position:relative; transform-origin:50% 100%;}
  .onboard-card[data-step="0"] .onboard-mascot-sleep{display:inline-block; animation:onboardBreathe 2.6s ease-in-out infinite;}
  @keyframes onboardBreathe{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
  .onboard-card[data-step="1"] .onboard-mascot-spotted{display:inline-block; animation:onboardShake .5s ease;}
  .onboard-spotted-img{display:block; height:100%; width:auto;}
  .onboard-checklist-img{display:block; height:100%; width:auto;}
  .onboard-checklist-bug-left, .onboard-checklist-bug-right{position:absolute; pointer-events:none;}
  .onboard-checklist-bug-left{left:-20%; top:98%; width:34%; transform:translate(-45%,-70%);}
  .onboard-checklist-bug-right{left:108%; top:93%; width:20%; transform:translate(-50%,-50%) scaleX(-1);}
  @keyframes onboardStepIn{ 0%{transform:translateX(-10px) rotate(-3deg);} 27%{transform:translateX(3px) rotate(1deg);} 55%{transform:translateX(-6px) rotate(-2deg);} 80%{transform:translateX(2px) rotate(1deg);} 100%{transform:translateX(0) rotate(0deg);} }
  .onboard-spotted-bug{position:absolute; left:90%; top:90%; width:21%; transform:translate(-50%,-50%); pointer-events:none; animation:onboardShake .5s ease .12s;}
  .onboard-card[data-step="2"] .onboard-mascot-checklist{display:inline-block; animation:onboardStepIn .8s ease-out;}
  .onboard-card[data-step="3"] .onboard-mascot-report{display:block; animation:onboardPop .4s ease;}
  .onboard-sleep-img{display:block; height:100%; width:auto;}
  .onboard-sleep-mouth{position:absolute; pointer-events:none;}
  .onboard-sleep-mouth{left:37.54%; top:46.27%; width:24.77%; transform-origin:50% 40%; animation:onboardMouthSnore 2.6s ease-in-out infinite;}
  @keyframes onboardMouthSnore{ 0%,100%{transform:scale(1,1);} 35%{transform:scale(.96,.94);} 62%{transform:scale(1.015,1.015);} }
  /* Zzz cluster: one source image, split into 3 bands (top/mid/bottom Z) via clip-path so each letter can float independently */
  .onboard-sleep-zzz-wrap{position:absolute; left:77.78%; top:0.37%; width:21.92%; pointer-events:none;}
  .onboard-sleep-zzz-wrap .onboard-sleep-zzz{position:absolute; inset:0; width:100%; height:auto; display:block;}
  .onboard-zzz-a{ clip-path:inset(68% 0 0 0); animation:onboardZzzFloat 2.4s ease-in-out infinite; animation-delay:0s; }
  .onboard-zzz-b{ clip-path:inset(37% 0 31% 0); animation:onboardZzzFloat 2.4s ease-in-out infinite; animation-delay:.6s; }
  .onboard-zzz-c{ clip-path:inset(0 0 61% 0); animation:onboardZzzFloat 2.4s ease-in-out infinite; animation-delay:1.2s; }
  @keyframes onboardZzzFloat{
    0%{ transform:translateY(4px); opacity:0; }
    18%{ opacity:.9; }
    55%{ transform:translateY(-7px); opacity:.9; }
    85%{ opacity:0; }
    100%{ transform:translateY(-9px); opacity:0; }
  }
  @keyframes onboardShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-5px) rotate(-3deg);} 40%{transform:translateX(5px) rotate(3deg);} 60%{transform:translateX(-4px) rotate(-2deg);} 80%{transform:translateX(4px) rotate(2deg);} }
  @keyframes onboardPop{ 0%{transform:scale(.92);} 60%{transform:scale(1.04);} 100%{transform:scale(1);} }
  .onboard-fx{position:absolute; top:-6px; right:calc(50% - 74px); font-size:26px; line-height:1; pointer-events:none;}
  .onboard-card[data-step="1"] .onboard-fx{animation:onboardExclaimPulse .9s ease-in-out infinite;}
  @keyframes onboardExclaimPulse{ 0%{transform:scale(1.6); opacity:.5;} 55%{transform:scale(1); opacity:1;} 100%{transform:scale(1); opacity:1;} }
  @keyframes onboardTapPulse{ 0%,100%{transform:translateY(0); opacity:.55;} 50%{transform:translateY(-6px); opacity:1;} }
  @keyframes onboardBounce{ 0%{transform:scale(.4); opacity:0;} 60%{transform:scale(1.15); opacity:1;} 100%{transform:scale(1); opacity:1;} }
  .onboard-tap{display:none; justify-content:center; align-items:center; margin:2px 0 8px; position:relative;}
  .onboard-card[data-step="0"] .onboard-tap{display:flex;}
  .onboard-tap::after{
    content:""; position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px;
    border-radius:50%; background:radial-gradient(circle, rgba(244,152,0,.5) 0%, rgba(244,152,0,.18) 50%, transparent 75%);
    opacity:0; animation:onboardTapRing 1.8s ease-out infinite; pointer-events:none; z-index:0;
  }
  :root[data-theme="dark"] .onboard-tap::after{
    background:radial-gradient(circle, rgba(255,168,36,.55) 0%, rgba(255,168,36,.2) 50%, transparent 75%);
  }
  .onboard-tap-icon{height:46px; width:auto; display:block; position:relative; z-index:1; animation:onboardTapPulse 1.3s ease-in-out infinite;}
  @keyframes onboardTapRing{ 0%{transform:scale(.5); opacity:.8;} 70%{transform:scale(2.2); opacity:0;} 100%{transform:scale(2.2); opacity:0;} }
  .onboard-tap-icon-dark{display:none;}
  .onboard-sleep-bug{position:absolute; left:114%; top:87%; width:23%; transform:translate(-50%,-50%); pointer-events:none;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .onboard-tap-icon-light{display:none;}
    :root:not([data-theme="light"]) .onboard-tap-icon-dark{display:block;}
  }
  :root[data-theme="dark"] .onboard-tap-icon-light{display:none;}
  :root[data-theme="dark"] .onboard-tap-icon-dark{display:block;}
  /* Onboarding: "mission badge" eyebrow + poster-style sticky-note accents */
  #onboard-card > .auth-eyebrow{
    align-self:center; width:auto; display:inline-flex; align-items:center; gap:7px;
    padding:7px 16px; margin:0 auto 14px; background:var(--accent-soft); color:#8a5600;
    border-radius:var(--radius-pill); font-weight:700; font-family:"Kanit",sans-serif;
    font-size:11.5px; letter-spacing:.03em; text-transform:none;
  }
  #onboard-card > .auth-eyebrow::before{ content:"🐞"; height:auto; width:auto; background:none; font-size:13px; line-height:1; }
  #onboard-card > .auth-eyebrow::after{ display:none; }
  :root[data-theme="dark"] #onboard-card > .auth-eyebrow{ color:#ffd699; }
  .onboard-sticky{
    position:absolute; width:80px; padding:8px 9px; font-size:10.5px; font-weight:700; line-height:1.35;
    background:#FFF3D6; color:#7a6420; border-radius:5px; box-shadow:var(--shadow-sm);
    text-align:center; white-space:pre-line; pointer-events:none; z-index:1;
  }
  .onboard-sticky-1{ top:10px; left:-4px; transform:rotate(-7deg); }
  .onboard-sticky-2{ top:10px; right:-4px; transform:rotate(6deg); background:#FFE3B0; }
  .onboard-sticky-3{ top:104px; right:-10px; transform:rotate(4deg); display:none; }
  .onboard-sticky-4{ top:196px; left:-10px; transform:rotate(-5deg); background:#FFE3B0; display:none; }
  .onboard-card[data-step="0"] .onboard-sticky-3, .onboard-card[data-step="0"] .onboard-sticky-4{ display:block; }
  :root[data-theme="dark"] .onboard-sticky{ background:#3a3116; color:#e8d9a8; box-shadow:var(--shadow-sm); }
  :root[data-theme="dark"] .onboard-sticky-2{ background:#3d310f; }
  :root[data-theme="dark"] .onboard-sticky-4{ background:#3d310f; }
  @media (max-width:360px){
    .onboard-sticky{ width:68px; font-size:9.5px; padding:6px 7px; }
    .onboard-sticky-3{ top:98px; }
    .onboard-sticky-4{ top:182px; }
  }
  @media (max-width:340px){ .onboard-sticky-3, .onboard-sticky-4{ display:none; } }
  /* Small orange "pop" accents flanking the mission badge, echoing the poster reference (step 0 only) */
  .onboard-card[data-step="0"]::before, .onboard-card[data-step="0"]::after{
    content:"✦"; position:absolute; top:1px; color:var(--accent); font-size:13px; font-weight:700;
    pointer-events:none; z-index:2; line-height:1;
  }
  .onboard-card[data-step="0"]::before{ left:calc(50% - 66px); transform:rotate(-14deg); }
  .onboard-card[data-step="0"]::after{ right:calc(50% - 66px); transform:rotate(14deg); }
  /* Soft, out-of-focus desk photo behind the wake-up scene (light mode only) -- blurred so it reads as warm ambience, never competes with our own badge/notes */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .onboard-tap::after{
      background:radial-gradient(circle, rgba(255,168,36,.55) 0%, rgba(255,168,36,.2) 50%, transparent 75%);
    }
    :root:not([data-theme="light"]) #onboard-card > .auth-eyebrow{ color:#ffd699; }
    :root:not([data-theme="light"]) .onboard-sticky{ background:#3a3116; color:#e8d9a8; box-shadow:var(--shadow-sm); }
    :root:not([data-theme="light"]) .onboard-sticky-2{ background:#3d310f; }
    :root:not([data-theme="light"]) .onboard-sticky-4{ background:#3d310f; }
  }
  .onboard-caption{font-size:16px; font-weight:700; color:var(--ink); min-height:24px; margin:2px 0 4px;}
  .onboard-hint{font-size:12px; color:var(--ink-soft); font-weight:500; margin:0 0 6px;}
  .onboard-dots{display:flex; gap:6px; justify-content:center; margin:12px 0 16px;}
  .onboard-dots span{width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .2s ease, width .2s ease;}
  .onboard-dots span.is-active{background:var(--accent); width:16px; border-radius:var(--radius-pill);}
  .onboard-card .btn.block{margin-top:2px;}

  /* ================= Full-screen onboarding + login (matches campaign poster artwork) =================
     Active for the whole span from the mascot tap-through through the passcode-free employee login form
     (toggled in boot() / showLoginOrApp() via document.body.classList). Marketing/IT and the signed-in
     app itself are untouched — this never applies once emp-app is shown or while role-marketing/role-it
     are the visible tab. One flat gradient (no photo) lives on <body> for the whole span — mascot
     steps and the login form alike — so background and foreground read as a single seamless poster
     with no texture seam, on any aspect ratio (phone 9:16 or desktop 16:9). */
  .onboard-staff-shortcut{
    display:none; position:fixed; z-index:60;
    top:calc(env(safe-area-inset-top,0px) + 12px); right:calc(env(safe-area-inset-right,0px) + 12px);
    align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; letter-spacing:.02em;
    padding:7px 13px; border-radius:var(--radius-pill); box-shadow:var(--shadow-sm); cursor:pointer;
  }
  .onboard-staff-shortcut:hover{ color:var(--ink); }
  /* only on the login screen — not during the mascot tap-through */
  body.onboard-at-login .onboard-staff-shortcut{ display:inline-flex; }

  body.onboard-intro-active{ padding:0; }
  body.onboard-intro-active .wrap{ max-width:none; margin:0; }
  body.onboard-intro-active .top-nav,
  body.onboard-intro-active .hero,
  body.onboard-intro-active .role-nav{ display:none; }
  /* showSyncBanner() sets an inline style="display:block"; !important is required to win over it */
  body.onboard-intro-active .notice-box{ display:none !important; }
  body.onboard-intro-active .auth-shell{
    min-height:100vh; min-height:100dvh;
    align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 32px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 32px) calc(env(safe-area-inset-left,0px) + 16px);
    box-sizing:border-box;
  }
  /* one flat gradient backdrop for the whole span (onboarding steps + login form) — no photo,
     so foreground and background read as a single seamless poster instead of two layered textures */
  body.onboard-intro-active{
    background-image:
      radial-gradient(480px 380px at 15% 8%, rgba(244,152,0,.10), transparent 70%),
      radial-gradient(420px 340px at 88% 14%, rgba(244,152,0,.14), transparent 72%),
      linear-gradient(180deg, #FFFCF6 0%, #FFF6E8 100%);
    background-attachment: fixed;
  }
  :root[data-theme="dark"] body.onboard-intro-active{
    background-image:
      radial-gradient(480px 380px at 15% 8%, rgba(255,168,36,.08), transparent 70%),
      radial-gradient(420px 340px at 88% 14%, rgba(112,178,110,.07), transparent 72%),
      linear-gradient(180deg, #18191B 0%, #101113 100%);
    background-attachment: fixed;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) body.onboard-intro-active{
      background-image:
        radial-gradient(480px 380px at 15% 8%, rgba(255,168,36,.08), transparent 70%),
        radial-gradient(420px 340px at 88% 14%, rgba(112,178,110,.07), transparent 72%),
        linear-gradient(180deg, #18191B 0%, #101113 100%);
      background-attachment: fixed;
    }
  }
  /* the mascot card itself is chrome-free (no box/border/shadow) on every step, so the body's flat
     gradient reads as one continuous full-bleed screen with no visible card frame */
  body.onboard-intro-active .onboard-card{
    background-color:transparent; background-image:none; border:0; box-shadow:none; border-radius:0;
    /* !important: .auth-shell.auth-wide .card (3 classes) otherwise beats this (1 class + body) and forces 640px */
    max-width:460px !important; margin:0 auto;
  }
  /* Scale the whole mascot composition up on larger screens so the character and text read as a
     poster filling the frame, instead of a small fixed-size island surrounded by empty background.
     One transform grows mascot + badge + stickies + captions together, in proportion, with zero
     layout changes elsewhere. min() of a width-fit and a height-fit ratio means it is always capped
     by whichever dimension is tighter, so it can never push the card past either edge of the screen. */
  body.onboard-intro-active:not(.onboard-at-login) .onboard-card{
    --onboard-scale-w: clamp(1, calc((100vw - 64px) / 460px), 2.4);
    --onboard-scale-h: clamp(1, calc((100vh - 160px) / 420px), 2.4);
    transform: scale(min(var(--onboard-scale-w), var(--onboard-scale-h)));
    transform-origin: center center;
  }

  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .bar-row .lbl{width:150px; font-size:12px; color:var(--ink-soft); flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{flex:1; background:var(--surface-2); border-radius:var(--radius-pill); height:8px; overflow:hidden;}

  /* ================= Employee flow: mobile-first defaults (primary access is phone, not desktop) ================= */
  #role-employee .card{ padding:16px; border-radius:var(--radius-md); }
  #role-employee .btn{ padding:13px 20px; font-size:14px; min-height:46px; }

  #role-employee input[type=tel],#role-employee textarea,#role-employee select{ padding:12px 13px; }

  /* ================= UGLYCASH-inspired refresh: pill CTAs, hero stat card, bottom sheet, bolder onboarding (employee flow only) ================= */

  /* -- Pill-shaped CTA buttons -- */
  #role-employee .btn{ border-radius:var(--radius-pill); }
  #role-employee .btn:hover{ box-shadow:0 10px 26px rgba(244,152,0,.34), 0 0 0 6px var(--accent-glow); }
  #role-employee .btn:focus-visible{ box-shadow:0 0 0 4px var(--accent-glow); outline:none; }
  #role-employee .big-btn.primary{ border-radius:var(--radius-pill); padding-left:20px; padding-right:20px; box-shadow:0 0 0 5px var(--accent-glow); }
  #role-employee .big-btn.primary:hover{ box-shadow:0 0 0 7px var(--accent-glow), var(--shadow-sm); }
  :root[data-theme="dark"] #role-employee .big-btn.primary, :root:not([data-theme="light"]) #role-employee .big-btn.primary{ box-shadow:0 0 0 5px rgba(255,168,36,.22); }

  /* -- Home hero stat card (balance-card style) -- */
  #role-employee .hero-stat-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #role-employee .hero-stat-label{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin:0; }

  #role-employee .hero-stat-caption{ margin:0 0 4px; }

  #role-employee .hero-stat-actions .btn{ flex:1; }

  /* -- Bottom-sheet style confirmation (report success) -- */
  #role-employee #report-success-card{

  :root[data-theme="dark"] #role-employee #report-success-card, :root:not([data-theme="light"]) #role-employee #report-success-card{ box-shadow:0 -18px 48px rgba(0,0,0,.5); }

  @keyframes sheetSlideUp{ from{ transform:translateY(28px); opacity:0; } to{ transform:translateY(0); opacity:1; } }

    if(onboardStep === 0){
      fx.textContent = ""; caption.textContent = t("onboardStep0"); hint.textContent = t("onboardHint");
      startBtn.hidden = true;
    } else if(onboardStep === 1){
      fx.textContent = "❗️"; caption.textContent = t("onboardStep1"); hint.textContent = t("onboardHint");

  function renderHeader(){
    document.getElementById("hero-title").textContent = campaign.name || "App Bug Hunter";
    document.getElementById("hero-tagline").textContent = campaign.tagline || t("heroTaglineDefault");
    var meta = document.getElementById("hero-meta");
    var parts = [];
    if(campaign.startDate && campaign.endDate){
      parts.push('<div>'+t("heroPeriod")+'<b>'+campaign.startDate+' – '+campaign.endDate+'</b></div>');
      var days = daysLeft();
      if(days !== null) parts.push('<div>'+t("heroLeft")+'<b>'+(days>=0? days+" "+t("daysUnit") : t("ended"))+'</b></div>');
    }
    meta.innerHTML = parts.join("");
  }
  function daysLeft(){
    if(!campaign.endDate) return null;
    var end = new Date(campaign.endDate+"T23:59:59"); var now = new Date();
    return Math.ceil((end - now) / 86400000);
  }
  function progressPct(){
    if(!campaign.startDate || !campaign.endDate) return 0;
    var s = new Date(campaign.startDate).getTime(), e = new Date(campaign.endDate).getTime(), n = Date.now();
    if(e<=s) return 0;
    return Math.max(0, Math.min(100, Math.round((n-s)/(e-s)*100)));
  }

  function uploadPhotoFiles(fileList){
    var statusEl = document.getElementById("photo-upload-status");
    var all = Array.prototype.slice.call(fileList||[]);
    if(!all.length) return;
    if(!assetsCap){ statusEl.className="status-msg err"; statusEl.textContent=t("photoNoCapability"); return; }
    var images = all.filter(function(f){ return /^image\//.test(f.type); });
    if(!images.length){ statusEl.className="status-msg err"; statusEl.textContent=t("photoNotImage"); return; }
    var room = MAX_PHOTOS - pendingPhotos.length;
    if(room<=0){ statusEl.className="status-msg err"; statusEl.textContent=t("photoMaxReached"); return; }
    var overflow = images.length > room;
    images = images.slice(0, room);
    statusEl.className="status-msg"; statusEl.textContent=t("photoUploading");
    Promise.all(images.map(function(f){
      return assetsCap.upload(f).then(function(res){ pendingPhotos.push({id:res.id, url:res.url}); return null; }).catch(function(err){ return err; });
    })).then(function(errs){
      renderPhotoPreview();
      var firstErr = errs.filter(Boolean)[0];
      if(firstErr){ statusEl.className="status-msg err"; statusEl.textContent = (firstErr.code==="too_large") ? t("photoTooLarge") : t("photoUploadFail"); }
      else if(overflow){ statusEl.className="status-msg err"; statusEl.textContent = t("photoMaxReached"); }
      else { statusEl.className="status-msg ok"; statusEl.textContent = t("photoReady"); }
    });
  }

  photoDrop.addEventListener("dragleave", function(){ photoDrop.classList.remove("drag"); });
  photoDrop.addEventListener("drop", function(e){
    e.preventDefault(); photoDrop.classList.remove("drag");
    if(e.dataTransfer && e.dataTransfer.files) uploadPhotoFiles(e.dataTransfer.files);
  });
  document.addEventListener("paste", function(e){
    if(photoDrop.offsetParent === null) return; // report form not visible
    var items = (e.clipboardData || window.clipboardData) ? (e.clipboardData || window.clipboardData).items : null;
    if(!items) return;
    var files = [];
    for(var i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf("image")===0) files.push(items[i].getAsFile());
    }
    if(files.length){ uploadPhotoFiles(files); e.preventDefault(); }
  });

  // ---------------- guided report-form progress (Marker.io/BugHerd-style step feedback) ----------------
  function updateReportProgress(){
    var steps = document.querySelectorAll("#report-form .form-step");
    var doneCount = 0;
    steps.forEach(function(step, idx){
      var isDone;
      if(idx===0) isDone = !!document.getElementById("f-module").value;
      else if(idx===1) isDone = document.getElementById("f-desc").value.trim().length > 0;
      else if(idx===2) isDone = pendingPhotos.length>0 || document.getElementById("f-link").value.trim().length>0 || document.getElementById("f-devicemodel").value.trim().length>0;
      else isDone = document.getElementById("f-desc").value.trim().length > 0 && !!document.getElementById("f-module").value;
      step.classList.toggle("is-done", !!isDone);
      if(isDone) doneCount++;
    });
    var pct = Math.round((doneCount/steps.length)*100);
    var fill = document.getElementById("report-progress-fill");
    var label = document.getElementById("report-progress-label");
    if(fill) fill.style.width = pct+"%";
    if(label) label.textContent = t("reportProgressLabel")(doneCount, steps.length);
  }

  function computeAwardCandidates(){
    var hunterCount = {}, activeCount = {};
    reports.forEach(function(r){
      if(!r.employeeId) return;
      activeCount[r.employeeId] = (activeCount[r.employeeId]||0)+1;
      if(r.type==="bug" && (r.status==="verified"||r.status==="fixed")) hunterCount[r.employeeId] = (hunterCount[r.employeeId]||0)+1;
    });
    function topOf(map){ var keys = Object.keys(map).sort(function(a,b){ return map[b]-map[a]; }); return keys.length ? {employeeId:keys[0], score:map[keys[0]]} : null; }
    var hunterTop = topOf(hunterCount), activeTop = topOf(activeCount);
    var impactCandidates = reports.filter(function(r){ return r.type==="bug" && r.impact==="high" && (r.status==="verified"||r.status==="fixed"); }).sort(function(a,b){ return b.createdAt-a.createdAt; });
    var insightCandidates = reports.filter(function(r){ return r.type==="insight"; });
    function nameOf(empId){ var r = reports.find(function(x){ return x.employeeId===empId; }); return r ? r.employeeName : empId; }
    return {
      hunter: hunterTop ? {id:hunterTop.employeeId, name:nameOf(hunterTop.employeeId), score:hunterTop.score} : null,
      active: activeTop ? {id:activeTop.employeeId, name:nameOf(activeTop.employeeId), score:activeTop.score} : null,
      impactCandidates: impactCandidates, insightCandidates: insightCandidates
    };
  }

      mostActive: mostActiveId ? {employeeId:mostActiveId, employeeName:empName(mostActiveId)} : null,
      highestImpact: impactId ? {reportId:impactId, title:repTitle(impactId)} : null,
      bestInsight: insightId ? {reportId:insightId, title:repTitle(insightId)} : null
    }};
    var hint = document.getElementById("award-save-hint");
    db.doc("settings/awards").set(payload).then(function(){ hint.className="status-msg ok"; hint.textContent=t("savedAward"); })
      .catch(function(){ hint.className="status-msg err"; hint.textContent=t("saveFail"); });
  });
  document.getElementById("reopen-award-btn").addEventListener("click", function(){ if(db) db.doc("settings/awards").update({finalized:false}).catch(function(){}); });

  function fillSettingsForm(){
    document.getElementById("s-name").value = campaign.name||"";
    document.getElementById("s-tagline").value = campaign.tagline||"";
    document.getElementById("s-start").value = campaign.startDate||"";
    document.getElementById("s-end").value = campaign.endDate||"";
    document.getElementById("s-testlink").value = campaign.testAppLink||"";
    document.getElementById("s-announce").value = campaign.announcement||"";
    document.getElementById("s-faq").value = campaign.faq||"";
    document.getElementById("s-open").checked = campaign.bugSubmissionOpen !== false;
  }
  document.getElementById("settings-form").addEventListener("submit", function(e){
    e.preventDefault();
    if(!db) return;
    var hint = document.getElementById("settings-status");
    var startVal = document.getElementById("s-start").value, endVal = document.getElementById("s-end").value;
    if(startVal && endVal && endVal < startVal){
      hint.className="status-msg err"; hint.textContent=t("dateRangeInvalid"); return;
    }
    var payload = {
      name: document.getElementById("s-name").value.trim() || "App Bug Hunter",
      tagline: document.getElementById("s-tagline").value.trim(),
      startDate: startVal, endDate: endVal,
      testAppLink: document.getElementById("s-testlink").value.trim(), announcement: document.getElementById("s-announce").value.trim(),
      faq: document.getElementById("s-faq").value, bugSubmissionOpen: document.getElementById("s-open").checked
    };
    db.doc("settings/campaign").set(payload).then(function(){ hint.className="status-msg ok"; hint.textContent=t("savedSettings"); })
      .catch(function(){ hint.className="status-msg err"; hint.textContent=t("saveFail"); });
  });

  document.getElementById("export-csv-btn").addEventListener("click", function(){
    var statusEl = document.getElementById("export-status");
    var cols = ["id","bugCode","type","status","module","title","desc","steps","os","deviceModel","appVersion","impact","duplicateOf","employeeName","employeeId","branch","department","company","createdAt"];
    var lines = [cols.join(",")];
    reports.forEach(function(r){
      var row = cols.map(function(c){
        var v = c==="bugCode" ? bugCode(r.id) : c==="createdAt" ? fmtDate(r.createdAt) : c==="branch" ? bLabel(r.branch) : c==="department" ? dLabel(r.department) : c==="module" ? mLabel(r.module) : c==="status" ? sLabel(r.status) : c==="impact" ? (r.impact?iLabel(r.impact):"") : c==="type" ? typeLabel(r.type) : (r[c]||"");
        v = String(v).replace(/"/g,'""'); return '"'+v+'"';
      });
      lines.push(row.join(","));
    });
    var csv = lines.join("\r\n");
    if(!window.claude || !window.claude.use){ statusEl.className="status-msg err"; statusEl.textContent=t("exportNoView"); return; }
    window.claude.use("downloads").then(function(dl){
      if(!dl){ statusEl.className="status-msg err"; statusEl.textContent=t("exportUnavailable"); return; }
      dl.save({filename:"autoclik-bug-hunter-reports.csv", data:csv}).then(function(){ statusEl.className="status-msg ok"; statusEl.textContent=t("exportOk"); })
        .catch(function(){ statusEl.className="status-msg err"; statusEl.textContent=t("exportFail"); });
    });
  });

  // ============ IT ============
  var itUnlocked = false;
  document.getElementById("it-unlock-btn").addEventListener("click", function(){
    if(document.getElementById("it-pass").value.trim() === IT_PASSCODE){
      itUnlocked = true; document.getElementById("it-lock").hidden = true; document.getElementById("it-app").hidden = false; renderItList();
    } else { document.getElementById("it-lock-msg").textContent = t("errWrongPass"); }
  });
  document.getElementById("itf-status").addEventListener("change", renderItList);

  function renderItList(){
    if(!itUnlocked) return;
    var sf = document.getElementById("itf-status").value;
    var list = reports.slice().sort(function(a,b){ return b.createdAt-a.createdAt; });
    if(sf) list = list.filter(function(r){ return r.status===sf; });
    else list = list.filter(function(r){ return r.status==="pending"||r.status==="reviewing"; });
    var body = document.getElementById("it-list");
    if(!list.length){ body.innerHTML = '<p class="empty-note">'+t("noMatchIt")+'</p>'; return; }
    body.innerHTML = list.map(function(r){
      var impactSelect = '<div class="af-field"><span>'+t("itLabelImpact")+'</span><select data-field="impact" data-id="'+r.id+'"><option value="">'+t("impactPh")+'</option>' +
        ["low","medium","high"].map(function(k){ return '<option value="'+k+'"'+(r.impact===k?" selected":"")+'>'+iLabel(k)+'</option>'; }).join("") + '</select></div>';
      var statusSelect = '<div class="af-field"><span>'+t("itLabelStatus")+'</span><select data-field="status" data-id="'+r.id+'">' +
        STATUS_ORDER.map(function(k){ return '<option value="'+k+'"'+(r.status===k?" selected":"")+'>'+sLabel(k)+'</option>'; }).join("") + '</select></div>';
      var dupInput = '<div class="af-field"><span>'+t("itLabelDup")+'</span><input type="text" data-field="duplicateOf" data-id="'+r.id+'" placeholder="'+t("dupPh")+'" value="'+escapeHtml(r.duplicateOf||"")+'"></div>';
      var noteInput = '<div class="af-field"><span>'+t("itLabelNote")+'</span><input type="text" data-field="itNote" data-id="'+r.id+'" placeholder="'+t("notePh")+'" value="'+escapeHtml(r.itNote||"")+'"></div>';
      var actions = '<div class="af-actions"><span class="save-hint" data-hint="'+r.id+'"></span><button type="button" class="btn small" data-confirm="'+r.id+'">'+t("btnConfirmVerify")+'</button></div>';
      return '<div class="report '+accClass(r.status)+'">' + reportCardInner(r) +
        '<div class="admin-controls">'+statusSelect+impactSelect+dupInput+noteInput+actions+'</div></div>';
    }).join("");

    body.querySelectorAll("[data-confirm]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.dataset.confirm;
        var card = btn.closest(".report");
        var hint = body.querySelector('[data-hint="'+id+'"]');
        if(!db){ if(hint) hint.textContent=t("notReadyHint"); return; }
        var patch = {
          status: card.querySelector('[data-field="status"]').value,
          impact: card.querySelector('[data-field="impact"]').value || null,
          duplicateOf: card.querySelector('[data-field="duplicateOf"]').value,
          itNote: card.querySelector('[data-field="itNote"]').value
        };
        btn.disabled = true;
        db.collection("reports").doc(id).update(patch).then(function(){
          if(hint){ hint.textContent=t("savedHint"); setTimeout(function(){ hint.textContent=""; },2000); }
        }).catch(function(){ if(hint) hint.textContent=t("saveFailHint"); }).finally(function(){ btn.disabled=false; });
      });
    });
  }

  // ---------------- boot ----------------
  function showSyncBanner(msg){
    var el = document.getElementById("sync-status-banner");
    if(!el) return;
    el.textContent = msg;
    el.style.display = "block";
  }
  function hideSyncBanner(){
    var el = document.getElementById("sync-status-banner");
    if(!el) return;
    el.style.display = "none";
  }
  function boot(){
    try{ var storedTheme = localStorage.getItem(THEME_KEY); applyTheme(storedTheme||"system"); }catch(e){ applyTheme("system"); }
    try{ var storedLang = localStorage.getItem(LANG_KEY); if(storedLang==="en"||storedLang==="th") lang = storedLang; }catch(e){}
    applyLanguage();
    onboardStep = 0; renderOnboard();
    document.getElementById("emp-onboarding").hidden = false;
    document.body.classList.add("onboard-intro-active");

    if(!window.claude || !window.claude.use){ showSyncBanner(t("dbUnavailable")); return; }
    window.claude.use("assets").then(function(a){ assetsCap = a; if(!a){ var s=document.getElementById("photo-upload-status"); if(s){ s.className="status-msg err"; s.textContent=t("photoNoCapability"); } } }).catch(function(){});
    var dbReadyTimer = setTimeout(function(){ showSyncBanner(t("dbTimeout")); }, 9000);
    window.claude.use("db").then(function(d){
      clearTimeout(dbReadyTimer);
      db = d;
      if(!db){ showSyncBanner(t("dbUnavailable")); return; }
      hideSyncBanner();
      setTimeout(function(){ reportsSettled = true; renderAll(); }, 10000); // don't show "empty" forever if the store never sends a definitive snapshot
      db.collection("reports").orderBy("createdAt","desc").limit(1000).onSnapshot(function(snap){
        reports = snap.docs.map(function(doc){ var data = doc.data()||{}; data.id = doc.id; return data; });
        if(!snap.metadata || !snap.metadata.fromCache) reportsSettled = true;
        hideSyncBanner();
        renderAll();
      }, function(err){
        console.error("reports sub error", err);
        reportsSettled = true;
        showSyncBanner(t("syncErrorPrefix")+" "+(err && err.code ? err.code : "unknown")+")");
      });
      db.doc("settings/campaign").onSnapshot(function(snap){
        if(snap.exists){ var d2 = snap.data()||{}; campaign = Object.assign({}, campaign, d2); }
        renderHeader(); renderHome(); renderRules(); updateReportOpenState(); fillSettingsForm();
      }, function(err){ console.error("campaign sub error", err); });
      db.doc("settings/awards").onSnapshot(function(snap){
        awards = snap.exists ? Object.assign({finalized:false}, snap.data()) : {finalized:false};
        renderAwards();
      }, function(err){ console.error("awards sub error", err); });
    }).catch(function(err){
      clearTimeout(dbReadyTimer);
      console.error("db use() rejected", err);
      showSyncBanner(t("dbUnavailable"));
    });
  }
  boot();
})();
</script>

</body></html>
